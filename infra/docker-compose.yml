services:
  api:
    build: ../apps/api
    env_file:
      - path: ../.env
        required: false
    environment:
      DATA_ROOT: /data
      WHISPER_SERVICE_URL: http://host.docker.internal:9001
      OPENROUTER_MODELS: ${OPENROUTER_MODELS:-}
    volumes:
      - ../data:/data
    ports:
      - "8000:8000"
    extra_hosts:
      - "host.docker.internal:host-gateway"
  web:
    build: ../apps/web
    ports:
      - "5173:80"
    depends_on:
      - api
